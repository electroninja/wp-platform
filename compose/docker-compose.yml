services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      php:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../app/bedrock:/var/www/html
      - wp_uploads:/var/www/html/web/app/uploads
    networks: [wp_net]

  php:
    build:
      context: ../app
      dockerfile: Dockerfile
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: ../.env
    volumes:
      - ../app/bedrock:/var/www/html
      - wp_uploads:/var/www/html/web/app/uploads
    networks: [wp_net]

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks: [wp_net]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    networks: [wp_net]

  wpcli:
    build:
      context: ../app
      dockerfile: Dockerfile
    depends_on:
      php:
        condition: service_healthy
    env_file: ../.env
    entrypoint: ["/bin/sh", "/var/www/html/bootstrap.sh"]
    volumes:
      - wp_uploads:/var/www/html/web/app/uploads
    networks: [wp_net]
    profiles: ["bootstrap"]

volumes:
  db_data:
  wp_uploads:

networks:
  wp_net:
